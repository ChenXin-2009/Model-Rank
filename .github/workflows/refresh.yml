name: Refresh data

on:
  schedule:
    # 每日 08:10 UTC+8（00:10 UTC）
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定快照日期（YYYY-MM-DD），留空则自动探测最新可用日期"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch data snapshot
        id: fetch
        env:
          SNAPSHOT_DATE: ${{ inputs.date }}
          SNAPSHOT_LOOKBACK_DAYS: "30"
        run: |
          args=()
          if [ -n "$SNAPSHOT_DATE" ]; then
            args+=(--date "$SNAPSHOT_DATE")
          fi
          set +e
          node scripts/fetch-data.mjs "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            # 上游没有新快照：保留旧数据，不把定时任务标红
            echo "::warning::上游暂无可用新快照，已保留现有数据"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Fetch LMArena arena rankings
        id: lmarena
        if: always()
        run: |
          set +e
          node scripts/fetch-lmarena.mjs
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            # LMArena 暂时不可用：保留现有 Arena 榜，不把定时任务标红
            echo "::warning::LMArena 暂无可用数据，已保留现有 Arena 榜"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Sync logos
        if: always() && (steps.fetch.outputs.code == '0' || steps.lmarena.outputs.code == '0')
        run: node scripts/sync-logos.mjs

      - name: Check snapshot freshness
        id: freshness
        if: always()
        run: |
          TEXT_DATE=$(node -e "const m=require('./data/snapshot/meta.json');process.stdout.write((m.sources&&m.sources.models&&m.sources.models.date)||m.date||'')")
          LATEST_DATE=$(node -p "require('./data/snapshot/meta.json').date")
          if [ -z "$TEXT_DATE" ]; then TEXT_DATE="$LATEST_DATE"; fi
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$TEXT_DATE" +%s) ) / 86400 ))
          echo "date=$TEXT_DATE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_DATE" >> "$GITHUB_OUTPUT"
          echo "age=$AGE" >> "$GITHUB_OUTPUT"
          if [ "$AGE" -ge 3 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## 数据快照"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 最新数据日期 | \`$LATEST_DATE\` |"
            echo "| 文本/语音快照 | \`$TEXT_DATE\`（$AGE 天前） |"
            echo ""
            echo "| 文件 | 来源 | 日期 |"
            echo "| --- | --- | --- |"
            node -e "const m=require('./data/snapshot/meta.json');for(const [k,v] of Object.entries(m.sources||{}))console.log('| '+k+' | '+(v.label||v.source||'-')+' | '+v.date+' |')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AGE" -ge 3 ]; then
            echo "::warning::文本/语音快照已 $AGE 天未更新（LLM Rank 上游停更）"
          fi

      - name: Commit data changes
        run: |
          git config user.name "model-rank-bot"
          git config user.email "model-rank-bot@users.noreply.github.com"
          git add data/ public/ src/lib/logos.ts
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi

          SNAPSHOT_CHANGED=$(git diff --cached --name-only -- \
            data/snapshot/models.json \
            data/snapshot/text-to-image.json \
            data/snapshot/text-to-video.json \
            data/snapshot/image-to-video.json \
            data/snapshot/text-to-speech.json \
            data/snapshot/meta.json)
          EXCHANGE_CHANGED=$(git diff --cached --name-only -- data/snapshot/exchange.json)
          NEW_DATE=$(node -p "require('./data/snapshot/meta.json').date")
          if [ -n "$SNAPSHOT_CHANGED" ]; then
            MSG="chore(data): refresh snapshot $NEW_DATE"
          elif [ -n "$EXCHANGE_CHANGED" ]; then
            RATE=$(node -p "require('./data/snapshot/exchange.json').rate")
            MSG="chore(data): update exchange rate (1 USD = $RATE CNY)"
          else
            MSG="chore(data): sync provider logos"
          fi
          git commit -m "$MSG"
          git push

      - name: Report stale snapshot
        if: always() && steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.freshness.outputs.date }}
          LATEST: ${{ steps.freshness.outputs.latest }}
          AGE: ${{ steps.freshness.outputs.age }}
        run: |
          gh label create data-stale --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "上游数据快照过期" 2>/dev/null || true
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --label data-stale --state open --json number --jq '.[0].number // empty')
          BODY=$(printf '文本/语音快照来自 LLM Rank（Artificial Analysis），最新为 `%s`，已 **%s 天** 未更新。\n\nArena 榜（文生图 / 文生视频 / 图生视频）已切换到 LMArena，目前最新数据为 `%s`。\n\n刷新工作流会继续每天检查并保留最后一份可用数据；LLM Rank 恢复后本 issue 会自动关闭。\n\n- LLM Rank：https://llmrank.cn\n- LMArena 数据集：https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset' "$DATE" "$AGE" "$LATEST")
          if [ -z "$NUM" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "文本数据快照已过期：LLM Rank 上游停更" --label data-stale --body "$BODY"
          else
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi

      - name: Close stale snapshot issue
        if: always() && steps.freshness.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.freshness.outputs.date }}
        run: |
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --label data-stale --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "LLM Rank 文本/语音快照已恢复，当前快照：\`$DATE\`。"
          fi
