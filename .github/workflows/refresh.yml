name: Refresh data

on:
  schedule:
    # 每日 08:10 UTC+8（00:10 UTC）
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-data.mjs
      - name: Commit data changes
        run: |
          git config user.name "model-rank-bot"
          git config user.email "model-rank-bot@users.noreply.github.com"
          if git diff --quiet data/ && git diff --cached --quiet data/; then
            echo "no data changes"
          else
            git add data/
            git commit -m "chore(data): refresh snapshot $(node -p "require('./data/snapshot/meta.json').date")"
            git push
          fi